<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Linkiir">
  <title>Linkiir</title>
  <!-- Solid plate so the mark stays legible on both light and dark browser tabs.
       Stroke is heavier than the 1.5 used on linkiir.com because the mark has to
       survive being rendered at 16px. -->
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4">
    <circle cx="12.4" cy="16" r="7.4"/>
    <circle cx="19.6" cy="16" r="7.4"/>
  </g>
</svg>
