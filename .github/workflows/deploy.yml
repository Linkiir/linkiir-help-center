name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Lets you re-publish without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. `cancel-in-progress: false` so an in-flight
# deploy finishes rather than leaving Pages half-updated.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Repository variables. For a project site set:
          #   SITE_URL = https://<org>.github.io
          #   BASE_URL = /<repo-name>/
          # For a custom domain, set SITE_URL to it, leave BASE_URL as / and add
          # a static/CNAME file. Unset values fall back to the config defaults.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_URL: ${{ vars.BASE_URL }}
          # Algolia DocSearch. Search stays switched off until all three exist.
          # The API key must be the search-only key, never the admin key.
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME }}
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
